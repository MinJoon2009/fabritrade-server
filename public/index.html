<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FabriTrade</title>
<style>
  :root{
    --blue:#1f4e79; --blue2:#2e75b6; --light:#dce6f1; --grey:#f2f4f7;
    --line:#e2e6ec; --text:#1a2230; --muted:#647084; --green:#1f9d6b; --gold:#caa14a;
    --radius:12px; --shadow:0 1px 3px rgba(20,30,50,.08),0 4px 16px rgba(20,30,50,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:#fafbfc;line-height:1.5;transition:background .2s,color .2s}
  body.dark{
    --blue:#5b9bd5; --blue2:#7cb3e0; --light:#1e2d3f; --grey:#1a2330;
    --line:#2a3545; --text:#e6ebf2; --muted:#93a0b4; --shadow:0 4px 18px rgba(0,0,0,.4);
    background:#0f151e;
  }
  body.dark header{background:#141c27;border-bottom-color:#2a3545}
  body.dark .card,body.dark .panel,body.dark .buybox,body.dark .form,body.dark .stat,body.dark table.data,body.dark .chat-wrap,body.dark .sellerbox,body.dark .modal,body.dark .search,body.dark select.lang,body.dark .role,body.dark .panel input,body.dark .panel select,body.dark .form input,body.dark .form select,body.dark .form textarea,body.dark .composer input,body.dark .qty input{background:#141c27;color:var(--text)}
  body.dark .chat .head,body.dark .thread{background:#141c27}
  body.dark .thread:hover,body.dark .thread.active{background:#1a2330}
  body.dark .msg.them{background:#243142}
  body.dark table.data tr:nth-child(even) td,body.dark .card .swatch{background:#1a2330}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  img{display:block}
  /* header */
  header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
  .bar{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:12px 20px}
  .logo{font-weight:800;font-size:22px;color:var(--blue);letter-spacing:-.5px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .logo .dot{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:inline-block}
  nav{display:flex;gap:4px;margin-left:6px;flex:1}
  nav button{padding:8px 14px;border-radius:8px;color:var(--muted);font-size:14.5px;font-weight:600}
  nav button:hover{background:var(--grey);color:var(--text)}
  nav button.active{background:var(--light);color:var(--blue)}
  .ctrl{display:flex;align-items:center;gap:10px}
  select.lang{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:#fff;font-weight:600;color:var(--text)}
  .role{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .role button{padding:7px 11px;font-size:12.5px;font-weight:700;color:var(--muted)}
  .role button.on{background:var(--blue);color:#fff}
  .badge{background:var(--blue);color:#fff;border-radius:999px;font-size:11px;padding:2px 7px;font-weight:700;margin-left:4px}
  .iconbtn{position:relative;width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted)}
  .iconbtn:hover{background:var(--grey);color:var(--text)}
  .iconbtn .count{position:absolute;top:-3px;right:-3px;background:#e0533d;color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-weight:800}
  .heart{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:15px;z-index:3;cursor:pointer;transition:.15s}
  .heart:hover{transform:scale(1.12)}
  .heart.on{color:#e0533d}
  .swatch .cert{right:44px}
  select.cur{padding:7px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;font-weight:700;color:var(--text)}
  /* layout */
  main{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
  h1.page{font-size:26px;margin:4px 0 4px}
  .sub{color:var(--muted);margin:0 0 22px;font-size:14.5px}
  /* hero */
  .hero{background:linear-gradient(120deg,#1f4e79,#2e75b6);border-radius:18px;color:#fff;padding:34px 34px;margin-bottom:26px;position:relative;overflow:hidden}
  .hero h2{margin:0 0 8px;font-size:30px;font-weight:800}
  .hero p{margin:0;opacity:.92;font-size:15.5px;max-width:560px}
  .hero .tags{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
  .hero .tags span{background:rgba(255,255,255,.16);padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600}
  /* search row */
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  .search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff}
  .search input{border:none;outline:none;padding:11px 0;font-size:14.5px;width:100%;background:none}
  .filters{display:flex;gap:18px;align-items:flex-start}
  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px;width:230px;flex:none}
  .panel h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .panel label{display:block;font-size:13.5px;margin:0 0 5px;font-weight:600}
  .panel select,.panel input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;margin-bottom:12px;background:#fff}
  .panel .clear{font-size:12.5px;color:var(--blue2);font-weight:700}
  /* grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;flex:1}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
  .card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
  .swatch{height:140px;position:relative;overflow:hidden}
  .swatch .ph,.bigswatch .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
  .swatch .pin,.swatch .cert{z-index:2}
  .swatch .pin{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.92);border-radius:6px;font-size:11px;font-weight:700;padding:3px 7px;color:var(--text)}
  .swatch .cert{position:absolute;top:8px;right:8px;background:var(--green);color:#fff;border-radius:6px;font-size:10px;font-weight:700;padding:3px 7px}
  .card .body{padding:12px 13px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card .ttl{font-weight:700;font-size:14.5px;line-height:1.3}
  .card .meta{font-size:12.5px;color:var(--muted)}
  .card .price{font-weight:800;color:var(--blue);font-size:16px;margin-top:auto}
  .card .moq{font-size:11.5px;color:var(--muted)}
  .seller-line{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
  .star{color:var(--gold);font-size:12px}
  /* detail */
  .detail{display:grid;grid-template-columns:1fr 360px;gap:26px}
  @media(max-width:820px){.detail{grid-template-columns:1fr!important}.filters{flex-direction:column}.panel{width:100%}}
  .bigswatch{height:300px;border-radius:14px;position:relative;overflow:hidden}
  .bigswatch .ph{border-radius:14px}
  .spec-table{width:100%;border-collapse:collapse;margin-top:14px}
  .spec-table td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
  .spec-table td:first-child{color:var(--muted);width:42%}
  .spec-table td:last-child{font-weight:600}
  .buybox{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;position:sticky;top:80px}
  .buybox .p{font-size:26px;font-weight:800;color:var(--blue)}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin:7px 0}
  .row .mut{color:var(--muted)}
  .qty{display:flex;align-items:center;gap:8px;margin:14px 0}
  .qty input{width:90px;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:15px;text-align:center}
  .btn{display:block;width:100%;text-align:center;padding:12px;border-radius:10px;font-weight:700;font-size:15px;margin-top:10px}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{background:#163a5c}
  .btn-ghost{background:#fff;border:1px solid var(--blue);color:var(--blue)}
  .btn-ghost:hover{background:var(--light)}
  .hr{height:1px;background:var(--line);margin:14px 0}
  .commission-note{background:var(--grey);border-radius:10px;padding:12px;font-size:12.5px;color:var(--muted);margin-top:12px}
  .commission-note b{color:var(--text)}
  .back{color:var(--blue2);font-weight:700;font-size:14px;margin-bottom:14px;display:inline-block}
  /* seller box */
  .sellerbox{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:16px;display:flex;gap:12px;align-items:center}
  .avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}
  /* messages */
  .chat-wrap{display:grid;grid-template-columns:260px 1fr;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;min-height:520px}
  @media(max-width:820px){.chat-wrap{grid-template-columns:1fr}.threads{display:none}}
  .threads{border-right:1px solid var(--line);background:var(--grey)}
  .thread{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
  .thread:hover,.thread.active{background:#fff}
  .thread .n{font-weight:700;font-size:14px}
  .thread .last{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat{display:flex;flex-direction:column}
  .chat .head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .msgs{flex:1;padding:18px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:380px}
  .msg{max-width:74%;padding:9px 13px;border-radius:14px;font-size:14px}
  .msg.them{background:var(--grey);align-self:flex-start;border-bottom-left-radius:4px}
  .msg.me{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .msg .tr{display:block;font-size:11.5px;opacity:.7;margin-top:4px;font-style:italic}
  .composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  .composer input{flex:1;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:14px}
  .toggle{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
  /* forms */
  .form{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;max-width:640px}
  .form .fld{margin-bottom:16px}
  .form label{display:block;font-weight:700;font-size:13.5px;margin-bottom:6px}
  .form input,.form select,.form textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .uploader{border:2px dashed var(--line);border-radius:12px;min-height:170px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;text-align:center;background:var(--grey);transition:.15s}
  .uploader:hover{border-color:var(--blue2);background:var(--light)}
  .uploader .up-empty{padding:24px}
  .uploader .preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .rmphoto{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;font-size:12px;font-weight:700;padding:6px 10px;z-index:2}
  .rmphoto:hover{background:rgba(0,0,0,.8)}
  /* dashboard */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:22px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .stat .lbl{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .stat .val{font-size:28px;font-weight:800;margin-top:6px;color:var(--blue)}
  .stat .val.green{color:var(--green)}
  table.data{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  table.data th{background:var(--blue);color:#fff;text-align:left;padding:11px 14px;font-size:12.5px;text-transform:uppercase;letter-spacing:.3px}
  table.data td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
  table.data tr:nth-child(even) td{background:var(--grey)}
  .pill{border-radius:999px;font-size:11px;font-weight:700;padding:3px 9px}
  .pill.escrow{background:#fff4d6;color:#9a7400}
  .pill.done{background:#d8f3e6;color:#13754f}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,25,40,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:26px;animation:pop .2s}
  @keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h3{margin:0 0 4px;font-size:20px}
  .modal .check{width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px}
  .ord-row{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;border-bottom:1px dashed var(--line)}
  .ord-row.tot{font-weight:800;border-bottom:none;font-size:16px;margin-top:4px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;z-index:200;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1}
  .empty{text-align:center;color:var(--muted);padding:50px;font-size:14.5px}
  @media(max-width:820px){.cartlayout{grid-template-columns:1fr!important}}
  .section-h{font-size:18px;font-weight:800;margin:6px 0 12px;display:flex;align-items:center;gap:8px}
  .hscroll{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 12px;margin-bottom:10px;scroll-snap-type:x mandatory}
  .hscroll .card{width:210px;flex:none;scroll-snap-align:start}
  .hscroll::-webkit-scrollbar{height:8px}.hscroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
  #toTop{position:fixed;bottom:90px;right:24px;width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;font-size:20px;box-shadow:var(--shadow);z-index:80;opacity:0;pointer-events:none;transition:.2s}
  #toTop.show{opacity:1;pointer-events:auto}
  #toTop:hover{background:#163a5c}
  /* AI assistant */
  .ai-cap{background:linear-gradient(120deg,#5b2ea6,#3a56d4);border-radius:16px;color:#fff;padding:18px 22px;margin-bottom:22px}
  .ai-cap .ct{font-weight:800;font-size:16px;margin-bottom:12px}
  .ai-cap .caps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .ai-cap .cap{background:rgba(255,255,255,.14);border-radius:10px;padding:11px 13px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:flex-start}
  .ai-fab{position:fixed;bottom:24px;right:24px;height:54px;padding:0 20px;border-radius:999px;background:linear-gradient(135deg,#7b3ff2,#4361ee);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 24px rgba(80,60,200,.45);z-index:120;border:none;cursor:pointer}
  .ai-fab:hover{transform:translateY(-2px)}
  .ai-panel{position:fixed;bottom:90px;right:24px;width:370px;max-width:calc(100vw - 32px);height:500px;max-height:76vh;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 48px rgba(20,30,60,.28);z-index:120;display:none;flex-direction:column;overflow:hidden}
  .ai-panel.show{display:flex}
  body.dark .ai-panel{background:#141c27}
  .ai-head{background:linear-gradient(135deg,#7b3ff2,#4361ee);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  .ai-head .tt{font-weight:800}.ai-head .ss{font-size:11.5px;opacity:.85}
  .ai-head .x{cursor:pointer;font-size:18px;opacity:.9}
  .ai-msgs{flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;background:var(--grey)}
  .ai-msg{max-width:86%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.5}
  .ai-msg.bot{background:#fff;align-self:flex-start;border:1px solid var(--line);border-bottom-left-radius:4px}
  body.dark .ai-msg.bot{background:#1a2330}
  .ai-msg.me{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .ai-chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;background:var(--grey);border-top:1px solid var(--line)}
  .ai-chip{font-size:12px;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:999px;padding:6px 10px;cursor:pointer}
  .ai-chip:hover{background:var(--light)}body.dark .ai-chip{background:#1a2330}
  .ai-composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#fff}
  body.dark .ai-composer{background:#141c27}
  .ai-composer input{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff;color:var(--text)}
  body.dark .ai-composer input{background:#1a2330}
  .ai-mod{background:linear-gradient(90deg,#ede7ff,#e6efff);color:#4b2ea6;font-size:12px;font-weight:700;padding:8px 14px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line)}
  body.dark .ai-mod{background:#241a3d;color:#c3b2ff}
  .msg-ai{align-self:center;max-width:92%;background:#fff5e6;border:1px solid #f0c675;color:#8a5a00;border-radius:12px;padding:10px 13px;font-size:12.5px;line-height:1.5;text-align:center}
  body.dark .msg-ai{background:#3a2e12;border-color:#6b5320;color:#f2cf8a}
  .pbreaks{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:12px 0}
  .pb-h{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;margin-bottom:6px}
  .pb-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 6px;border-radius:6px}
  .pb-row.on{background:var(--light);font-weight:800;color:var(--blue)}
  .track{display:flex;align-items:center;margin-top:14px}
  .tstep{display:flex;flex-direction:column;align-items:center;gap:5px;flex:none}
  .tdot{width:26px;height:26px;border-radius:50%;background:var(--grey);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--muted)}
  .tstep.done .tdot{background:var(--green);border-color:var(--green);color:#fff}
  .tlbl{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
  .tstep.done .tlbl{color:var(--text)}
  .tbar{flex:1;height:3px;background:var(--line);margin:0 4px;margin-bottom:18px;border-radius:2px}
  .tbar.done{background:var(--green)}
  /* best-version polish */
  .card{animation:cardIn .32s ease both}
  @keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .statband{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  @media(max-width:640px){.statband{grid-template-columns:repeat(2,1fr)}}
  .statband .s{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 12px;text-align:center}
  body.dark .statband .s{background:#141c27}
  .statband .n{font-size:23px;font-weight:800;color:var(--blue)}
  .statband .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
  .how{background:linear-gradient(120deg,#f4f7fb,#eef3fb);border:1px solid var(--line);border-radius:16px;padding:22px;margin:2px 0 24px}
  body.dark .how{background:#141c27}
  .how h3{margin:0 0 16px;font-size:18px}
  .how .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  @media(max-width:700px){.how .cols{grid-template-columns:1fr}}
  .how .c .hn{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-bottom:8px}
  .how .c .ht{font-weight:800;margin-bottom:3px}
  .how .c .hd{font-size:13px;color:var(--muted)}
  footer#foot{max-width:1180px;margin:0 auto;padding:26px 20px 46px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}

</header>

<footer id="foot"></footer>

    tg1t:"Chào mừng đến FabriTrade 👋", tg1:"Hướng dẫn 1 phút này đưa bạn đi qua ứng dụng khi bạn xem trực tiếp. Bạn có thể bỏ qua bất cứ lúc nào và mở lại từ nút ❓.",
    tg2t:"Khám phá sàn", tg2:"Đây là trang chủ. Dùng ô tìm kiếm và bộ lọc bên trái (loại, xuất xứ, chứng nhận, MOQ, giá) để tìm vải. Vải nổi bật ở trên cùng, có thể sắp xếp theo giá hoặc đánh giá.",
    tg3t:"Trang sản phẩm", tg3:"Chi tiết đầy đủ của vải: thành phần, định lượng, khổ, chứng nhận và đánh giá người bán. Bên phải: giá theo số lượng (mua nhiều rẻ hơn), Mua ngay, Thêm vào giỏ, Đặt mẫu và Liên hệ người bán.",
    tg4t:"Giỏ hàng & thanh toán an toàn", tg4:"Thêm nhiều loại vải và thanh toán một lần. Tiền được giữ ký quỹ đến khi bạn xác nhận nhận hàng. FabriTrade chỉ giữ 3,5% mỗi giao dịch — người bán nhận phần còn lại.",
    tg5t:"Bán vải của bạn", tg5:"Ai cũng có thể bán. Điền biểu mẫu, thêm ảnh và đăng. Nhấn '✨ AI: tự điền chi tiết' để AI gợi ý thành phần, định lượng và giá hợp lý.",
    tg6t:"Quản lý tin đăng", tg6:"Mọi thứ bạn đang bán ở đây. Sửa giá, xóa, hoặc '🚀 Đẩy tin' để xuất hiện trong hàng Nổi bật đầu sàn.",
    tg7t:"Bảng RFQ — để người bán tìm bạn", tg7:"Đăng thứ bạn cần (vải, số lượng, ngân sách) và người bán gửi báo giá. Hoặc nhấn '✨ Để AI tìm người bán cho tôi' để AI khớp người bán tốt nhất và soạn tin đầu tiên.",
    tg8t:"Tin nhắn: có dịch & được bảo vệ", tg8:"Trò chuyện trực tiếp với người mua/bán. Bật 'AI tự động dịch' để đọc mọi tin bằng ngôn ngữ của bạn. AI kiểm duyệt theo dõi mọi cuộc trò chuyện và cảnh báo nếu ai đó muốn giao dịch ngoài nền tảng.",
    tg9t:"Theo dõi giá AI", tg9:"AI quét tin tức thế giới 24/7 — hạn hán, giá dầu, chậm vận chuyển, thuế — và cho bạn biết giá vải nào sắp tăng hay giảm để canh thời điểm mua.",
    tg10t:"Đơn hàng, theo dõi & trợ lý AI", tg10:"Theo dõi mọi đơn: Đã thanh toán → Đang chuẩn bị → Đã gửi → Đã giao. Nút ✨ Trợ lý AI (góc dưới phải) luôn sẵn sàng tìm vải, kiểm tra người bán hoặc hỗ trợ xuất nhập khẩu.",
    tg11t:"Bạn đã sẵn sàng! 🎉", tg11:"Đó là toàn bộ nền tảng. Bên dưới là giải đáp các câu hỏi thường gặp. Chúc giao dịch vui!",

    faq1q:"Tôi thanh toán thế nào, tiền có an toàn không?", faq1a:"Bạn thanh toán trong FabriTrade và tiền được giữ ký quỹ. Chỉ giải ngân cho người bán sau khi bạn xác nhận đã nhận hàng. Nếu có vấn đề, mở tranh chấp và AI sẽ hòa giải.",

function validEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function doAuth(){
  const g=id=>{const e=document.getElementById(id);return e?e.value.trim():"";};
  const email=g("au_email").toLowerCase(), pass=g("au_pass");
  state.authErr="";
  const users=loadUsers();
  if(state.authMode==="signup"){
    const name=g("au_name");
    if(!name||!email||!pass){ state.authErr=t("auth_err_fields"); return renderAuth(); }
    if(!validEmail(email)){ state.authErr=t("auth_bad_email"); return renderAuth(); }
    if(users.some(u=>u.email===email)){ state.authErr=t("auth_err_exists"); return renderAuth(); }
    const user={name,email,pass:hashPw(pass),role:state.authRole};
    users.push(user); saveUsers(users);
    finishAuth(user);
  } else {
    if(!email||!pass){ state.authErr=t("auth_err_fields"); return renderAuth(); }
    const user=users.find(u=>u.email===email && u.pass===hashPw(pass));
    if(!user){ state.authErr=t("auth_err_login"); return renderAuth(); }
    finishAuth(user);
  }
}
function finishAuth(user){
  state.user={id:user.id,name:user.name,email:user.email,role:user.role};
  state.role=(user.role==="owner")?"seller":(user.role||"buyer");
  try{localStorage.setItem("ft_user",JSON.stringify(state.user));}catch(e){}
  document.body.classList.remove("auth");
  if(state.view==="sell"||state.view==="store"||state.view==="dash") {} else state.view="browse";
  render(); animView();
  toast(t("intro_welcome_toast")+", "+String(user.name).split(" ")[0]+" 👋");
  setTimeout(showTour, 900); // offer the guided tour once to new users (skippable)
}
function logout(){
  state.user=null; try{localStorage.removeItem("ft_user");}catch(e){}
  state.view="browse"; showAuth();
}

    if(f.origin && !L(x.origin).includes(f.origin)) return false;
    if(f.cert && x.cert!==f.cert) return false;
    if(f.maxmoq && x.moq>+f.maxmoq) return false;
    if(f.maxprice && x.price>+f.maxprice) return false;
    if(q){ const hay=(L(x.title)+" "+x.comp+" "+x.type+" "+L(x.origin)).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  const s=state.sort;
  if(s==="pl") r.sort((a,b)=>a.price-b.price);
  else if(s==="ph") r.sort((a,b)=>b.price-a.price);
  else if(s==="rate") r.sort((a,b)=>b.seller.r-a.seller.r);
  else if(s==="moq") r.sort((a,b)=>a.moq-b.moq);
  else if(s==="new") r.sort((a,b)=>b.id-a.id);
  else r.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0)); // featured first by default
  return r;
}

// bulk price breaks: bigger orders get a lower per-meter price
function tiersFor(x){ return [
  {min:x.moq,      price:x.price},
  {min:x.moq*5,    price:+(x.price*0.92).toFixed(2)},
  {min:x.moq*20,   price:+(x.price*0.85).toFixed(2)},
];}
function unitFor(x,q){ const ts=tiersFor(x); let p=ts[0].price; ts.forEach(tt=>{ if(q>=tt.min) p=tt.price; }); return p; }

function placeOrder(id){
  const x=LISTINGS.find(l=>l.id===id); const q=state.qty[id]||x.moq;
  const sub=q*unitFor(x,q), comm=sub*COMMISSION;
  state.orders.unshift({title:L(x.title),qty:q,total:sub,comm,date:new Date().toISOString().slice(0,10),status:"escrow",step:1});

const RISKY=["bank","wire","whatsapp","wechat","telegram","zalo","paypal","western union","off platform","off-platform","offline","outside","skip the fee","skip the platform","account number","转账","银行","线下","微信","私下","chuyển khoản","ngoài nền tảng","ngân hàng"];
function isRisky(s){ s=s.toLowerCase(); return RISKY.some(w=>s.includes(w)); }
function sendMsg(){

  const th=THREADS.find(x=>x.id===state.threadId);

function postRFQ(){
  const g=id=>document.getElementById(id).value.trim();
  const title=g("r_title"); if(!title){toast(t("auth_err_fields"));return;}
  const id=Math.max(0,...state.rfqs.map(r=>r.id))+1;
  state.rfqs.unshift({id,title,type:g("r_type"),qty:+g("r_qty")||100,budget:+g("r_budget")||0,notes:g("r_notes"),by:state.user?state.user.name:"You",offers:[]});
  toast(t("rfq_posted")); render();
}
function sendOffer(id){
  const r=state.rfqs.find(x=>x.id===id);
  showModal(`<h3>${t("rfq_send_offer")}</h3><p class="sub" style="margin:4px 0 12px">${r.title} · ${r.qty} m</p>
    <label style="font-weight:700;font-size:13px">${t("rfq_your_price")}</label>
    <input id="o_price" type="number" step="0.1" value="${r.budget||''}" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:6px 0 14px">
    <button class="btn btn-primary" onclick="confirmOffer(${id})">${t("send")}</button>
    <button class="btn btn-ghost" onclick="closeModal()">${t("cancel")}</button>`);
}
function confirmOffer(id){
  const r=state.rfqs.find(x=>x.id===id); const p=+document.getElementById("o_price").value||r.budget;
  r.offers.push({seller:state.user?state.user.name:"My Mill (You)",price:p});
  closeModal(); toast(t("rfq_offer_sent")); render();
}
function aiMatch(spec){
  const budget=+spec.budget||Infinity;
  let m=LISTINGS.filter(x=>x.type===spec.type).sort((a,b)=>a.price-b.price);
  let ok=m.filter(x=>x.price<=budget); if(!ok.length) ok=m;
  return ok.slice(0,3);
}
function aiSourceFromForm(){
  const g=id=>document.getElementById(id).value.trim();
  const spec={title:g("r_title")||g("r_type"),type:g("r_type"),qty:+g("r_qty")||500,budget:+g("r_budget")||0};
  state.aiSrc={spec,matches:aiMatch(spec)}; render(); window.scrollTo(0,0);

function aiSourceRFQ(id){

function aiReply(text){
  const s=(text||"").toLowerCase(), R=AI_RESP[state.lang]||AI_RESP.en;
  const has=(...w)=>w.some(x=>s.includes(x));
  if(has("fee","commission","3.5","佣金","phí","hoa hồng")) return R.fee;
  if(has("price","news","market","trend","forecast","价格","新闻","行情","giá","tin tức","thị trường"))
    return {en:"Open the AI Price Watch tab — I scan world news 24/7 and flag events (droughts, oil, freight, tariffs) that move cotton, silk, polyester and more, so you can time your buying.",zh:"请打开“AI 价格监测”标签——我全天候扫描全球新闻，标记影响棉、丝、聚酯等价格的事件（干旱、油价、运费、关税），帮您把握采购时机。",vi:"Mở tab “Theo dõi giá AI” — tôi quét tin tức 24/7 và đánh dấu các sự kiện (hạn hán, dầu, cước, thuế) ảnh hưởng giá cotton, lụa, polyester… để bạn canh thời điểm mua."}[state.lang];
  if(has("verify","trust","legit","safe","scam check","可靠","认证","信任","xác minh","đáng tin","tin cậy")) return R.verify;
  if(has("ship","import","export","customs","incoterm","duty","进出口","关税","清关","xuất","nhập","vận chuyển","hải quan")) return R.ship;
  if(has("dispute","refund","problem","wrong","纠纷","退款","问题","tranh chấp","hoàn tiền","vấn đề")) return R.dispute;
  if(has("find","cotton","silk","linen","looking","organic","source","找","有机","面料","tìm","hữu cơ","vải")) return R.find;
  if(has("hi","hello","hey","你好","您好","chào","xin chào")) return R.hi;
  return R.def;
}

  {k:"tg3", go:()=>{ const x=LISTINGS[0]; if(x) openDetail(x.id); else go("browse"); }},

  {k:"tg8", go:()=>{ state.threadId=1; go("messages"); }},

let tourStep=-1;
function showTour(){ // auto-offer once after first login (skippable)
  try{ if(localStorage.getItem("ft_tour")) return; }catch(e){}
  startTour();
}
function openTour(){ startTour(); }           // ❓ button
function startTour(){ tourStep=0; runTourStep(); }
function runTourStep(){
  const s=TOUR[tourStep]; if(!s){ endTour(); return; }
  try{ s.go(); }catch(e){}
  renderTourCard();
}
function renderTourCard(){
  const s=TOUR[tourStep]; if(!s) return;
  const card=document.getElementById("tourCard"); if(!card) return;
  const n=TOUR.length, last=tourStep===n-1;
  card.innerHTML=`
    <div class="tc-top"><span class="tc-step">${t("tg_step")} ${tourStep+1} ${t("tg_of")} ${n}</span><span class="tc-x" onclick="endTour()">✕</span></div>
    <div class="tc-prog"><i style="width:${Math.round((tourStep+1)/n*100)}%"></i></div>
    <h4>${t(s.k+"t")}</h4><p>${t(s.k)}</p>
    <div class="tc-btns">
      ${tourStep>0?`<button class="btn btn-ghost" onclick="tourStep--;runTourStep()">${t("tg_back")}</button>`:""}
      <span class="sp"></span>
      ${last?"":`<span class="tc-skip" onclick="endTour()">${t("tg_skip")}</span>`}
      <button class="btn btn-primary" onclick="${last?'endTour()':'tourStep++;runTourStep()'}">${last?t("tg_done"):t("tg_next")}</button>
    </div>`;
  card.classList.add("show");
}
function endTour(){ tourStep=-1; const c=document.getElementById("tourCard"); if(c)c.classList.remove("show"); try{localStorage.setItem("ft_tour","1");}catch(e){} }

/* ============ help & FAQ ============ */
function viewHelp(){
  const faqs=[1,2,3,4,5,6].map(i=>`<details class="faq"><summary>${t("faq"+i+"q")}</summary><div class="fa">${t("faq"+i+"a")}</div></details>`).join("");
  return `<h1 class="page">❓ ${t("help_t")}</h1><p class="sub">${t("help_s")}</p>
    <button class="btn btn-primary" style="width:auto;padding:12px 20px;margin:0 0 22px" onclick="startTour()">▶ ${t("tg_restart")}</button>
    ${faqs}`;
}

function showModal(html){ document.getElementById("modal").innerHTML=html; document.getElementById("overlay").classList.add("show"); }
function closeModal(){ document.getElementById("overlay").classList.remove("show"); }
let toastTimer;
function toast(msg){ const e=document.getElementById("toast"); e.textContent=msg; e.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>e.classList.remove("show"),2200); }

/* =====================================================================
   LIVE MODE — when a FabriTrade server is reachable, the app uses it:
   real accounts, shared listings/orders/RFQs/messages. Otherwise it stays
   in demo mode (everything saved in this browser).
   Set window.FT_API = "https://your-server" to use a server on another domain.
   ===================================================================== */
let LIVE=false, SERVER_CFG=null;
let TOKEN=null; try{ TOKEN=localStorage.getItem("ft_token")||null; }catch(e){}
const API_BASE=(typeof window!=="undefined" && window.FT_API) ? String(window.FT_API).replace(/\/$/,"") : "";
async function api(path,method="GET",bodyObj){
  const headers={"Content-Type":"application/json"}; if(TOKEN) headers["Authorization"]="Bearer "+TOKEN;
  const res=await fetch(API_BASE+path,{method,headers,body:bodyObj?JSON.stringify(bodyObj):undefined});
  let data={}; try{ data=await res.json(); }catch(e){}
  if(!res.ok) throw new Error(data.error||("Server error "+res.status));
  return data;
}
async function detectLive(){
  try{ const r=await fetch(API_BASE+"/api/health",{cache:"no-store"}); if(!r.ok) return; const j=await r.json(); if(j&&j.mode==="live"){ LIVE=true; SERVER_CFG=j; } }catch(e){}
}
function normL(l){
  return Object.assign({}, l, { title:l.title, origin:l.origin||"", comp:l.comp||"", cert:l.cert||"", inco:l.inco||"FOB", stock:l.stock||"in stock", lead:l.lead||7,
    seller:{n:l.sellerName||"Seller", r:l.rating||4.8, t:l.trades||0}, grad:sw(l.color||"#cdbfa6", l.color||"#b3a384"),
    img:l.img||picByType(l.type,l.id), mine:!!(state.user && state.user.id===l.ownerId), featured:!!l.featured });
}
function normO(o){ return { id:o.id, title:(o.sample?"🧵 ":"")+o.title, qty:o.qty, total:o.total, comm:o.commission, date:new Date(o.createdAt).toISOString().slice(0,10), status:o.status, step:o.step||1, sample:!!o.sample }; }
async function liveRefresh(){
  const [ls,rq]=await Promise.all([api("/api/listings"),api("/api/rfqs")]);
  LISTINGS=ls.listings.map(normL); state.rfqs=rq.rfqs;
  try{ state.liveStats=await api("/api/stats"); }catch(e){}
  if(TOKEN && state.user){
    try{ const o=await api("/api/my/orders"); state.orders=o.orders.map(normO); }catch(e){}
    try{ const th=await api("/api/messages/threads"); THREADS.length=0; th.threads.forEach(x=>THREADS.push({id:x.userId,name:x.name,msgs:[{me:false,t:x.lastText,tr:""}]})); }catch(e){}
    try{ const so=await api("/api/seller/orders"); state.sellerStats=so; }catch(e){}
  }
}
function liveErr(e){ toast(e&&e.message?e.message:"Something went wrong"); }

// --- save/load: in live mode only keep personal preferences locally ---
const _save=save;
save=function(){ if(!LIVE) return _save(); try{ localStorage.setItem(LS_KEY, JSON.stringify({lang:state.lang,cur:state.cur,dark:state.dark,role:state.role,cart:state.cart,fav:state.fav,recent:state.recent})); }catch(e){} };

// --- auth ---
const _doAuth=doAuth;
doAuth=async function(){
  if(!LIVE) return _doAuth();
  const g=id=>{const e=document.getElementById(id);return e?e.value.trim():"";};
  const email=g("au_email").toLowerCase(), pass=g("au_pass"); state.authErr="";
  try{
    let r;
    if(state.authMode==="signup"){ const name=g("au_name"); if(!name||!email||!pass){state.authErr=t("auth_err_fields");return renderAuth();} if(!validEmail(email)){state.authErr=t("auth_bad_email");return renderAuth();}
      r=await api("/api/register","POST",{name,email,password:pass,role:state.authRole}); }
    else { if(!email||!pass){state.authErr=t("auth_err_fields");return renderAuth();} r=await api("/api/login","POST",{email,password:pass}); }
    TOKEN=r.token; try{localStorage.setItem("ft_token",TOKEN);}catch(e){}
    state.user={id:r.user.id,name:r.user.name,email:r.user.email,role:r.user.role};
    await liveRefresh().catch(()=>{});
    finishAuth(state.user);
    if(r.owner) setTimeout(()=>toast("👑 You are the platform owner. Use the Manager site to control everything."),2500);
  }catch(e){ state.authErr=e.message; renderAuth(); }
};
const _logout=logout;
logout=function(){ TOKEN=null; try{localStorage.removeItem("ft_token");}catch(e){} state.orders=[]; THREADS.length=0; _logout(); };

// --- listings ---
function readListingForm(){ const g=id=>document.getElementById(id).value; return {title:g("s_title")||"New Fabric Listing",type:g("s_type"),comp:g("s_comp"),gsm:+g("s_gsm")||150,width:+g("s_width")||150,price:+g("s_price")||1,moq:+g("s_moq")||50,origin:g("s_origin")||"Vietnam",cert:g("s_cert"),color:g("s_color"),img:state.uploadImg||""}; }
const _publish=publish;
publish=async function(){ if(!LIVE) return _publish();
  try{ const d=readListingForm(); if(!state.uploadImg && !state.editId) d.img=picByType(d.type,Date.now()%1000);
    if(state.editId){ if(!d.img) delete d.img; await api("/api/listings/"+state.editId,"PUT",d); toast(t("saved_ok")); } else { await api("/api/listings","POST",d); toast(t("listed_ok")); }
    state.editId=null; state.uploadImg=null; await liveRefresh(); go("store"); }catch(e){ liveErr(e); } };
const _confirmDelete=confirmDelete;
confirmDelete=async function(id){ if(!LIVE) return _confirmDelete(id); try{ await api("/api/listings/"+id,"DELETE"); state.cart=state.cart.filter(c=>c.id!==id); state.fav=state.fav.filter(f=>f!==id); closeModal(); toast(t("deleted_ok")); await liveRefresh(); render(); }catch(e){ liveErr(e); } };
const _confirmBoost=confirmBoost;
confirmBoost=async function(id){ if(!LIVE) return _confirmBoost(id); try{ await api("/api/listings/"+id+"/boost","POST"); closeModal(); toast(t("boosted")); await liveRefresh(); render(); }catch(e){ liveErr(e); } };

// --- orders ---
function orderDoneModal(comm){ showModal(`<div class="check">✓</div><h3 style="text-align:center">${t("order_done")}</h3><p class="sub" style="text-align:center;margin:8px 0 18px">${t("order_done_p")}</p><div class="commission-note" style="text-align:center">FabriTrade ${state.lang==='zh'?'佣金':state.lang==='vi'?'hoa hồng':'commission'}: <b style="color:var(--green)">${money(comm)}</b></div><button class="btn btn-primary" onclick="closeModal();go('orders')">${t("great")}</button>`); }
const _placeOrder=placeOrder;
placeOrder=async function(id){ if(!LIVE) return _placeOrder(id); try{ const x=LISTINGS.find(l=>l.id===id); const q=state.qty[id]||x.moq; const r=await api("/api/orders","POST",{listingId:id,qty:q}); await liveRefresh(); orderDoneModal(r.order.commission); }catch(e){ liveErr(e); } };
const _placeSample=placeSample;
placeSample=async function(id){ if(!LIVE) return _placeSample(id); try{ await api("/api/orders","POST",{listingId:id,sample:true}); closeModal(); toast(t("sample_placed")); await liveRefresh(); go("orders"); }catch(e){ liveErr(e); } };
const _checkoutCart=checkoutCart;
checkoutCart=async function(){ if(!LIVE) return _checkoutCart(); try{ let comm=0; for(const c of state.cart){ const r=await api("/api/orders","POST",{listingId:c.id,qty:c.qty}); comm+=r.order.commission; } state.cart=[]; await liveRefresh(); orderDoneModal(comm); }catch(e){ liveErr(e); } };

// --- RFQs ---
const _postRFQ=postRFQ;
postRFQ=async function(){ if(!LIVE) return _postRFQ(); try{ const g=id=>document.getElementById(id).value.trim(); const title=g("r_title"); if(!title){toast(t("auth_err_fields"));return;}
  await api("/api/rfqs","POST",{title,type:g("r_type"),qty:+g("r_qty")||100,budget:+g("r_budget")||0,notes:g("r_notes")}); toast(t("rfq_posted")); await liveRefresh(); render(); }catch(e){ liveErr(e); } };
const _confirmOffer=confirmOffer;
confirmOffer=async function(id){ if(!LIVE) return _confirmOffer(id); try{ const p=+document.getElementById("o_price").value; await api("/api/rfqs/"+id+"/offers","POST",{price:p}); closeModal(); toast(t("rfq_offer_sent")); await liveRefresh(); render(); }catch(e){ liveErr(e); } };

// --- messages ---
async function openThread(uid){ state.threadId=uid; try{ const m=await api("/api/messages?withUserId="+uid); const th=THREADS.find(x=>x.id===uid); if(th){ th.msgs=[]; m.messages.forEach(x=>{ th.msgs.push({me:x.mine,t:x.text,tr:""}); if(x.flagged) th.msgs.push({ai:true}); }); if(!th.msgs.length) th.msgs.push({me:false,t:"…",tr:""}); } }catch(e){} render(); scrollChat(); }
const _contactSeller=contactSeller;
contactSeller=async function(listingId){ if(!LIVE) return _contactSeller(listingId);
  try{ const r=await api("/api/users/lookup?listingId="+listingId); const uid=r.user.id;
    if(state.user && uid===state.user.id){ toast("This is your own listing."); return; }
    if(!THREADS.find(x=>x.id===uid)) THREADS.unshift({id:uid,name:r.user.name,msgs:[{me:false,t:"…",tr:""}]});
    state.view="messages"; toast(t("contacted")); await openThread(uid); }catch(e){ liveErr(e); } };
const _sendMsg=sendMsg;
sendMsg=async function(){ if(!LIVE) return _sendMsg();
  const el=document.getElementById("msgInput"); const v=el.value.trim(); if(!v||!state.threadId)return;
  try{ el.value=""; await api("/api/messages","POST",{toId:state.threadId,text:v}); await openThread(state.threadId); }catch(e){ liveErr(e); } };
const _viewMessages=viewMessages;
viewMessages=function(){ if(!LIVE) return _viewMessages();
  const th=THREADS.find(x=>x.id===state.threadId)||THREADS[0];
  if(!th) return `<h1 class="page">${t("chat_title")}</h1><div class="empty">${t("no_thread")}</div>`;
  return `<h1 class="page">${t("chat_title")}</h1><div class="sub">&nbsp;</div>
  <div class="chat-wrap"><div class="threads">${THREADS.map(x=>`<div class="thread ${x.id===th.id?'active':''}" onclick="openThread(${x.id})"><div class="n">${x.name}</div><div class="last">${(x.msgs[x.msgs.length-1]||{}).t||""}</div></div>`).join("")}</div>
    <div class="chat"><div class="head"><strong>${th.name}</strong><label class="toggle"><input type="checkbox" ${state.translate?'checked':''} onchange="state.translate=this.checked;render()"> 🌐 ${t("translate")}</label></div>
      <div class="ai-mod">🛡️ ${t("ai_mod")}</div>
      <div class="msgs" id="msgs">${th.msgs.map(m=> m.ai?`<div class="msg-ai">${t("ai_mod_warn")}</div>`:`<div class="msg ${m.me?'me':'them'}">${escapeHtml(m.t)}</div>`).join("")}</div>
      <div class="composer"><input id="msgInput" placeholder="${t("type_msg")}" onkeydown="if(event.key==='Enter')sendMsg()"><button class="btn-primary" style="width:auto;padding:0 20px;border-radius:10px" onclick="sendMsg()">${t("send")}</button></div>
    </div></div>`; };
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// --- stats band, dashboard, announcement ---
const _statsBand=statsBand;
statsBand=function(){ if(!LIVE) return _statsBand();
  if(state.search||Object.values(state.filters).some(Boolean)) return "";
  const s=state.liveStats||{}; const ann=SERVER_CFG&&SERVER_CFG.announcement?`<div class="ai-mod" style="border-radius:12px;margin-bottom:14px;font-size:13px">📣 ${escapeHtml(SERVER_CFG.announcement)}</div>`:"";
  const items=[[String(s.users||0),t("sp_traders")],["50+",t("sp_countries")],[money(s.gmv||0).replace(/\.00$/,""),t("sp_gmv")],["4.8★",t("sp_rating")]];
  return ann+`<div class="statband">${items.map(x=>`<div class="s"><div class="n">${x[0]}</div><div class="l">${x[1]}</div></div>`).join("")}</div>`; };
const _viewDash=viewDash;
viewDash=function(){ if(!LIVE) return _viewDash();
  const so=state.sellerStats||{orders:[],revenue:0,commission:0}; const gmv=so.orders.reduce((s,o)=>s+o.total,0);
  return `<h1 class="page">${t("dash_title")}</h1><p class="sub">${t("dash_sub")}</p>
  <div class="stats">
    <div class="stat"><div class="lbl">${t("d_gmv")}</div><div class="val">${money(gmv)}</div></div>
    <div class="stat"><div class="lbl">${state.lang==='zh'?'您的实收':state.lang==='vi'?'Bạn nhận':'Your payouts'}</div><div class="val green">${money(so.revenue)}</div></div>
    <div class="stat"><div class="lbl">${t("d_comm")}</div><div class="val">${money(so.commission)}</div></div>
    <div class="stat"><div class="lbl">${t("d_orders")}</div><div class="val">${so.orders.length}</div></div>
  </div>
  ${so.orders.length?`<table class="data"><tr><th>${t("t_order")}</th><th>${t("t_buyer")}</th><th>${t("t_value")}</th><th>${t("t_comm")}</th><th>${t("t_status")}</th></tr>
  ${so.orders.map(o=>`<tr><td>#${o.id} ${escapeHtml(o.title)}</td><td>${escapeHtml(o.buyerName||"")}</td><td>${money(o.total)}</td><td style="color:var(--green);font-weight:700">${money(o.commission)}</td><td><span class="pill ${o.status==='released'?'done':'escrow'}">${o.status==='released'?t("st_done"):t("st_escrow")}</span></td></tr>`).join("")}</table>`:`<div class="empty">${t("ord_empty")}</div>`}`; };

/* ---------- start ---------- */
(async function start(){
  document.body.classList.toggle("dark", state.dark);
  window.addEventListener("scroll",()=>{const b=document.getElementById("toTop");if(b)b.classList.toggle("show",window.scrollY>500);});
  await detectLive();
  load();
  if(LIVE){
    state.user=null;
    if(TOKEN){ try{ const me=await api("/api/me"); state.user={id:me.user.id,name:me.user.name,email:me.user.email,role:me.user.role}; state.role=me.user.role==="owner"?"seller":(me.user.role||"buyer"); }catch(e){ TOKEN=null; try{localStorage.removeItem("ft_token");}catch(e2){} } }
    try{ await liveRefresh(); }catch(e){ console.warn("live refresh failed",e); }
  } else {
    try{ state.user=JSON.parse(localStorage.getItem("ft_user")||"null"); }catch(e){}
  }
  let seenIntro=false; try{ seenIntro=!!localStorage.getItem("ft_intro"); }catch(e){}
  if(state.user){ if(state.user.role && !LIVE) state.role=state.user.role; render(); showTour(); }
  else if(!seenIntro){ showIntro(); }
  else { showAuth(); }
})();
</script>
</body>
</html>
